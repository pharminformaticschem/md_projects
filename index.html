<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROMACS Cloud Engine | Advanced Automated Molecular Workspaces</title>

    <!-- CDN Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #02050e; color: #f1f5f9; overflow-x: hidden; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }

        .robotics-glass {
            background: rgba(8, 14, 32, 0.75);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(6, 182, 212, 0.25);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.08);
        }
        .robotics-glass-light {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .input-cyber {
            background: rgba(4, 8, 20, 0.9);
            border: 1px solid rgba(6, 182, 212, 0.25);
            border-radius: 10px; padding: 14px; width: 100%;
            color: #ffffff; font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-cyber:focus { border-color: #a855f7; outline: none; box-shadow: 0 0 15px rgba(168, 85, 247, 0.35); }
        .btn-action {
            background: linear-gradient(135deg, #06b6d4 0%, #7c3aed 100%);
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.25);
        }
        .btn-action:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(147, 51, 234, 0.45); }

        #mol-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.2; }

        @keyframes pulse-node {
            0%, 100% { transform: scale(1); opacity: 0.4; filter: drop-shadow(0 0 2px rgba(6,182,212,0.5)); }
            50% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 8px rgba(6,182,212,1)); }
        }
        .dl-node { animation: pulse-node 3s infinite ease-in-out; }

        @keyframes matrix-scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .hpc-scan-line { animation: matrix-scan 2s infinite linear; }
    </style>
</head>
<body class="min-h-screen">

    <canvas id="mol-canvas"></canvas>
    <div id="root" class="relative z-10"></div>

    <!--
    ╔══════════════════════════════════════════════════════════╗
    ║  LOAD ORDER (must be preserved):                        ║
    ║  1. globals.js   — config, data, utility functions       ║
    ║  2. components.js — reusable React sub-components        ║
    ║  3. app.js        — main App, state, form, page render   ║
    ║                                                          ║
    ║  To add a new page/feature:                              ║
    ║  → Add data/config to globals.js                         ║
    ║  → Add new component to components.js                    ║
    ║  → Drop <NewSection /> inside app.js's <main>            ║
    ╚══════════════════════════════════════════════════════════╝
    -->

    <!-- Part 1: Shared config, data, utilities (plain JS) -->
    <script src="globals.js"></script>

    <!-- Part 2: Reusable React components (JSX via Babel) -->
    <script type="text/babel" src="components.js"></script>

    <!-- Part 3: Main App — state, form, page assembly (JSX via Babel) -->
    <script type="text/babel" src="app.js"></script>

</body>
</html>
