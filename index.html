    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #02050e; 
            color: #f1f5f9; 
            overflow-x: hidden;
        }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        
        /* Premium Robotic High-Definition Glass Morphism */
        .robotics-glass {
            background: rgba(8, 14, 32, 0.75);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(6, 182, 212, 0.25);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.08);
        }
        .robotics-glass-light {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .input-cyber { 
            background: rgba(4, 8, 20, 0.9); 
            border: 1px solid rgba(6, 182, 212, 0.25); 
            border-radius: 10px; 
            padding: 14px; 
            width: 100%; 
            color: #ffffff; 
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .input-cyber:focus { 
            border-color: #a855f7; 
            outline: none; 
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.35);
        }
        
        .btn-action { 
            background: linear-gradient(135deg, #06b6d4 0%, #7c3aed 100%);

            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.25); 
        }
        .btn-action:hover { 
            transform: translateY(-1px); 
            box-shadow: 0 6px 25px rgba(147, 51, 234, 0.45);
        }

        /* Video / Canvas Background Engine styling */
        .bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.15;
        }
        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }
        #mol-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.2;
        }

        @keyframes pulse-node {
            0%, 100% { transform: scale(1); opacity: 0.4; filter: drop-shadow(0 0 2px rgba(6,182,212,0.5)); }

        }
        .dl-node { animation: pulse-node 3s infinite ease-in-out; }

        @keyframes matrix-scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .hpc-scan-line { animation: matrix-scan 2s infinite linear; }

</head>

        // BACKGROUND CANOPY GENERATION SCRIPT
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('mol-canvas');
            const ctx = canvas.getContext('2d');
            let atoms = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < 45; i++) {
                atoms.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 2 + 1.5,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "rgba(6, 182, 212, 0.4)";
                ctx.strokeStyle = "rgba(6, 182, 212, 0.05)";
                ctx.lineWidth = 1;

                atoms.forEach((a, idx) => {
                    a.x += a.vx;
                    a.y += a.vy;

                    if (a.x < 0 || a.x > canvas.width) a.vx *= -1;
                    if (a.y < 0 || a.y > canvas.height) a.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
                    ctx.fill();

                    for (let j = idx + 1; j < atoms.length; j++) {
                        let b = atoms[j];
                        let dist = Math.hypot(a.x - b.x, a.y - b.y);
                        if (dist < 110) {
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.stroke();
                        }
                    }
                });
                requestAnimationFrame(animate);
            }
            animate();
        });

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
